# Hanya untuk pengembangan lokal: menjalankan PostgreSQL.
# Compose produksi (frontend + backend + nginx + SSL) dibuat Orang 6.
services:
  db:
    image: postgres:16-alpine
    container_name: lms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms_password
      POSTGRES_DB: lms_db
    ports:
      - "5432:5432"
    volumes:
      - lms-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lms-db-data:
